name: Build PHP (Linux)

# Required repository secrets (same names as nativephp-php-bin-mobile):
#   R2_ACCESS_KEY_ID      - Cloudflare R2 access key
#   R2_SECRET_ACCESS_KEY  - Cloudflare R2 secret key

permissions:
  contents: read

on:
  schedule:
    # Every Friday at midnight UTC (matches the mobile build trigger).
    - cron: '0 0 * * 5'
  workflow_dispatch:
    inputs:
      version:
        description: 'PHP version to build'
        type: choice
        options:
          - all
          - "8.3"
          - "8.4"
          - "8.5"
        default: all

env:
  SPC_VERSION: 2.8.5
  # static-php-cli sends this with its GitHub API calls (pre-built libs come
  # from GitHub releases). Without it, macOS runners get rate-limited (403).
  GITHUB_TOKEN: ${{ github.token }}
  SPC_BUILD_OS: linux
  # Each branch uploads to its own directory: main/, feature-x/, etc.
  R2_PREFIX: ${{ format('{0}/', github.ref_name) }}
  R2_ENDPOINT: https://713f4e1d515cf082921cdf5122bf1739.r2.cloudflarestorage.com
  R2_BUCKET: nativephplibs

jobs:
  build:
    name: ${{ matrix.version }} ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON((github.event.inputs.version || 'all') == 'all' && '["8.3","8.4","8.5"]' || format('["{0}"]', github.event.inputs.version)) }}
        os: [ubuntu-latest, ubuntu-24.04-arm]
        include:
          - os: ubuntu-latest
            arch: x64
            spc_asset: spc-linux-x86_64.tar.gz
          - os: ubuntu-24.04-arm
            arch: arm64
            spc_asset: spc-linux-aarch64.tar.gz

    steps:
      - uses: actions/checkout@v6

      - name: Download SPC
        shell: bash
        run: |
          cd ..
          curl -fsSL -o spc.tar.gz "https://github.com/crazywhalecc/static-php-cli/releases/download/${SPC_VERSION}/${{ matrix.spc_asset }}"
          tar -xzf spc.tar.gz
          chmod +x spc
          mkdir -p static-php-cli/bin
          mv spc static-php-cli/bin/

      - name: Setup system PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          tools: pecl, composer
          extensions: curl, openssl, mbstring, sodium, tokenizer, filter
          ini-values: memory_limit=-1

      - name: SPC doctor
        run: |
          cd ../static-php-cli
          ./bin/spc doctor

      - name: Read PHP extensions from file
        shell: bash
        run: |
          EXTENSIONS=$(php -r "echo trim(file_get_contents('php-extensions.txt'));")
          echo "PHP_EXTENSIONS=$EXTENSIONS" >> $GITHUB_ENV

      - name: Read PHP libraries from file
        shell: bash
        run: |
          LIBRARIES=$(php -r "echo trim(file_get_contents('php-libraries.txt'));")
          echo "PHP_LIBS=$LIBRARIES" >> $GITHUB_ENV

      # No cache here on purpose: each run must pull the latest php-src patch
      # release, and a restored cache would silently rebuild an old one.
      - name: Download PHP extension sources
        run: |
          cd ../static-php-cli
          ./bin/spc download --with-php=${{ matrix.version }} --for-extensions "${{ env.PHP_EXTENSIONS }}" --prefer-pre-built --retry=3

      - name: Build PHP
        run: |
          cd ../static-php-cli
          ./bin/spc build --build-cli "${{ env.PHP_EXTENSIONS }}" --with-libs="${{ env.PHP_LIBS }}" --debug

      - name: Get built PHP version
        shell: bash
        run: |
          PHP_VERSION_FULL=$(../static-php-cli/buildroot/bin/php -r "echo PHP_VERSION;")
          echo "PHP_VERSION_FULL=$PHP_VERSION_FULL" >> $GITHUB_ENV

      - name: Create bin directories
        run: |
          mkdir -p bin/${{ env.SPC_BUILD_OS }}/${{ matrix.arch }}
          mkdir -p license-files
          mkdir -p build-meta

      - name: Zip PHP binary, copy metadata
        shell: bash
        run: |
          rm -f bin/${{ env.SPC_BUILD_OS }}/${{ matrix.arch }}/php-${{ matrix.version }}.zip
          mkdir -p tmp-bin
          cp ../static-php-cli/buildroot/bin/php tmp-bin/
          cd tmp-bin
          zip ../bin/${{ env.SPC_BUILD_OS }}/${{ matrix.arch }}/php-${{ matrix.version }}.zip php
          cd ..
          rm -rf tmp-bin
          cp ../static-php-cli/buildroot/license/* license-files/
          cp ../static-php-cli/buildroot/build-extensions.json build-meta/build-extensions-${{ env.SPC_BUILD_OS }}.json
          cp ../static-php-cli/buildroot/build-libraries.json build-meta/build-libraries-${{ env.SPC_BUILD_OS }}.json

      # Hand the zip to the publish job rather than uploading from here. The
      # dist/ layout matches the R2 keys under {branch}/.
      - name: Stage zip for publishing
        shell: bash
        run: |
          mkdir -p "dist/desktop/${SPC_BUILD_OS}/${{ matrix.arch }}"
          cp "bin/${SPC_BUILD_OS}/${{ matrix.arch }}/php-${{ matrix.version }}.zip" "dist/desktop/${SPC_BUILD_OS}/${{ matrix.arch }}/"

      - uses: actions/upload-artifact@v7
        with:
          name: php-${{ env.SPC_BUILD_OS }}-${{ matrix.arch }}-${{ matrix.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
          # A re-run of this leg replaces the zip from the earlier attempt.
          overwrite: true

  # Push every zip the build legs produced to R2, then regenerate the manifest
  # from the full bucket listing and upload it last, so it never points at a
  # missing object. This lives apart from the builds so a failed upload (bad
  # R2 credentials, say) can be re-run on its own without rebuilding PHP.
  publish:
    needs: build
    # Run even if some matrix legs failed, so whatever did build still ships.
    if: always() && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          pattern: php-*
          path: dist
          merge-multiple: true

      - name: Upload binaries to R2
        shell: bash
        run: |
          shopt -s nullglob
          cd dist
          for ZIP in desktop/*/*/*.zip; do
            DEST="${R2_PREFIX}${ZIP}"
            SHA=$(sha256sum "$ZIP" | awk '{print $1}')
            echo "$SHA  $(basename "$ZIP")" > "$ZIP.sha256"

            echo "Uploading $ZIP -> ${DEST} (sha256=$SHA)"
            aws s3 cp "$ZIP" "s3://${R2_BUCKET}/${DEST}" \
              --endpoint-url "$R2_ENDPOINT" \
              --cache-control "no-cache, no-store"

            aws s3 cp "$ZIP.sha256" "s3://${R2_BUCKET}/${DEST}.sha256" \
              --endpoint-url "$R2_ENDPOINT" \
              --content-type "text/plain" \
              --cache-control "no-cache, no-store"
          done

      - name: Generate and upload versions.json
        shell: bash
        env:
          BUCKET: ${{ env.R2_BUCKET }}
          BASE_URL: https://bin.nativephp.com
        run: |
          chmod +x .github/scripts/generate-versions-json.sh
          .github/scripts/generate-versions-json.sh > versions.json
          echo "versions.json:"
          cat versions.json

          aws s3 cp versions.json "s3://${R2_BUCKET}/${R2_PREFIX}desktop/versions.json" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type "application/json" \
            --cache-control "no-cache, no-store"
